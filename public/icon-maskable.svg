<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <!-- Variante « maskable » : le fond couvre tout le carré et le slime reste dans la zone sûre (cercle central de 80 %),
       car Android découpe l'icône en rond, en goutte, en carré arrondi... selon le téléphone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff" />
      <stop offset="1" stop-color="#3a6fd8" />
    </linearGradient>
    <linearGradient id="slime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6f77a" />
      <stop offset="1" stop-color="#2fb84a" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg)" />
  <g stroke-linejoin="round" stroke-linecap="round" transform="translate(64 64) scale(0.72) translate(-65 -73)">
    <ellipse cx="62" cy="113" rx="52" ry="8" fill="#000" opacity="0.22" />
    <path
      d="M8 106 C4 66 30 34 62 34 C74 18 84 22 80 34 C108 40 124 70 118 106 C102 116 28 118 8 106 Z"
      fill="url(#slime)"
      stroke="#1c6b34"
      stroke-width="4"
    />
    <ellipse cx="38" cy="58" rx="13" ry="7" fill="#fff" opacity="0.55" transform="rotate(-28 38 58)" />
    <circle cx="46" cy="82" r="11" fill="#fff" stroke="#1c6b34" stroke-width="3" />
    <circle cx="80" cy="82" r="11" fill="#fff" stroke="#1c6b34" stroke-width="3" />
    <circle cx="49" cy="85" r="5.5" fill="#1b2a2e" />
    <circle cx="83" cy="85" r="5.5" fill="#1b2a2e" />
    <path d="M52 101 Q63 110 74 101" fill="none" stroke="#1c6b34" stroke-width="3.5" />
  </g>
</svg>
